cases:
  - id: proportional-greenfield
    prompt: Create a Product Intent Package for a small single-user application.
    should_activate: true
    must:
      - start with root product context and physical architecture plus one named module owning the small product's behavior
      - do not treat small scope as an exemption from module ownership or require unnecessary boundary files and subdivisions
      - keep product.yaml to minimal context and direct links with observable behavior in diagrams
      - omit acceptance.yaml unless a unique case cannot be meaningfully diagrammed and explain that limitation
      - omit package and item status, readiness, signatures, confirmation metadata, implementation findings, and handoff records
      - omit governance when current repository or project guidance already makes editing authority unambiguous; otherwise use only a minimal current access policy
      - record release, outcome, boundary, actors, capabilities, exclusions, measures, and optional default DCL
      - add concise current rationale to owning diagram files without product history
      - leave unspecified internal choices to engineering within current constraints

  - id: modular-pip-boundaries
    prompt: >-
      Reorganize this large canonical PIP so a capability can be reviewed without
      reopening every linked process. Its preparation sequence mixes provider
      computation, accepted Catalog writes, and shared Job finalization. A private
      tool reuses preparation but forbids retaining its inputs or results.
      Raw scoring is reused by several policy-driven ranking workflows.
      Publication and a funding debit must commit atomically. Preserve behavior.
    should_activate: true
    must:
      - keep one canonical product record and all product logic in named modules without per-module manifests or acceptance checklists
      - establish diagram-owned public operation promises before relying on folder separation
      - separate preparation from state acceptance and raw score meaning from ranking policy without inventing new services or execution owners
      - keep ephemeral and persisted effects explicit without silently adding storage to the private tool
      - retain one owner for shared atomic publication and funding behavior and for coupled Catalog and Job finalization
      - keep full entities with one owner and use linked projections rather than duplicate schemas
      - have workflows live inside their responsible domain or orchestration module and consume linked public outcomes without repeating algorithms or hiding orchestration failure behavior
      - preserve stable references and test the review boundary on a representative change before broad file moves
      - keep migration steps and review evidence outside canonical intent

  - id: module-review-propagation
    prompt: >-
      Review three proposed PIP changes in an existing modular package. One changes
      ranking weights without changing raw fits. Another changes the meaning of
      an unavailable score from null to zero but leaves signatures and boundary
      text unchanged. The third splits atomic publication and debit into two
      independent commits. A consumer reads shared score state directly but has
      no link to its owner. Keep the review scoped to affected logic.
    should_activate: true
    must:
      - read root context, module-owned applicable constraints, changed internals, their boundaries, and consumed dependency contracts
      - review ranking and affected selection outcomes without reopening an unchanged raw-scoring algorithm by default
      - classify changed score meaning and transaction guarantees as exported semantic changes despite unchanged signatures or boundary text
      - discover the unlinked shared-state consumer and report the incomplete boundary rather than using missing links to stop review
      - inspect directly affected consumers and propagate only when their guarantees or shared invariants are affected
      - review publication and funding owners with their shared integration sequence and reject the split as behavior-preserving modularization
      - state scope and verification limits outside the PIP without claiming structural checks prove isolation

  - id: reject-partially-modular-layout
    prompt: >-
      Propose the complete PIP organization for a product with collectives,
      discovery, work, a token program, and paid HTTP. Existing records describe
      funded work, acquired earnings, management continuity, authorized requests,
      private artifacts, chain reconciliation, shared data and onchain state,
      quality constraints, user flows, and design-system rules. A draft puts the
      five features in modules but leaves those other records in root workflows,
      sequences, data, quality, and experience folders. No product behavior or
      implementation changes are requested.
    should_activate: true
    must:
      - identify the draft as only partially modular because shared and orchestration logic lacks module ownership
      - assign every listed logical responsibility to an existing coherent module or a justified additional module
      - put cross-module workflows inside the responsible domain or orchestration module with a public boundary
      - give shared authorization, privacy, reconciliation, state, and quality policies explicit module owners
      - retain one full entity owner and link projections rather than a root data model that owns every module's invariants
      - keep root product context and physical topology without independent rules in overview or design-system prose
      - avoid a generic shared or workflows dumping-ground module and avoid a module per file
      - preserve behavior, atomicity, dependencies, stable references, and review stopping rules
      - do not treat a pilot extraction as a complete modular organization or claim folders alone prove isolation

  - id: module-oriented-stack-context
    prompt: >-
      Reorganize the overview documents for a modular PIP. Catalog, matching,
      and delivery share one web backend and one database; catalog and delivery
      also use the same worker service. The stack-context document is currently
      organized only as frontend, backend, storage, and providers. Existing
      deployment and coordination overviews use different module names. Preserve
      the physical architecture and all product behavior.
    should_activate: true
    must:
      - strongly prefer module-named sections or diagram groups using the canonical module names
      - provide a direct module-oriented reading path through stack context and the existing overviews
      - keep a compact whole-product orientation only where useful rather than relying solely on layer inventories
      - identify shared services once and reuse physical identities or labeled references across module views
      - show each module's relevant systems, state, connections, and public-boundary links without repeating internal logic
      - distinguish logical module groupings from deployment and trust boundaries
      - preserve the shared backend, database, and worker instead of inventing per-module deployments
      - avoid mandatory new overview files, duplicated service specifications, or empty module sections

  - id: no-orphan-product-logic
    prompt: >-
      Review this PIP organization without changing product behavior. A shared
      eligibility rule has a complete decision diagram and applies_to: CAP-001,
      but no process invokes it. A publication process references a rules folder,
      calls another rule without handling its result, and never supplies the
      inputs. Two helper operations call each other without an entry trigger.
      An external API has a documented request-handling sequence, while a data
      uniqueness constraint is already linked at the sequence's guarded write.
      A final rule has no caller and unclear current purpose. All records have
      module owners. Is the logic sufficiently integrated?
    should_activate: true
    must:
      - identify module ownership, a complete diagram, applies_to, and generic references as insufficient evidence of actual process application
      - require explicit application points, input provenance, and meaningful result handling in documented consumers
      - reject the helper-only call cycle as orphan logic without a documented entry trigger
      - recognize the external request-handling sequence as a valid process entry without inventing an internal caller
      - preserve declarative constraint ownership and its existing write-step connection without adding a redundant runtime check or background job
      - resolve the unclear rule's intended application or obsolescence rather than inventing a consumer or silently deleting it
      - preserve one shared rule owner and avoid copying predicates into callers
      - inspect affected application sites without creating a global rule registry, call graph, or coverage ledger
      - distinguish documented intended processes from evidence that implementation already exists

  - id: reconstruct-existing-product
    prompt: Reconstruct the current intent of this existing product from its screens,
      code, documents, and stakeholder decisions.
    should_activate: true
    must:
      - use separate working notes and an isolated PIP fork
      - treat sources as evidence rather than automatic target intent
      - keep observations, inferences, questions, and implementation differences outside the PIP
      - route material product choices through an authority whose scope covers the complete change
      - express one coherent end state in the fork without status labels
      - leave the canonical PIP unchanged until the fork is adopted
      - preserve a legacy package format unless migration is explicitly requested

  - id: iterate-semantic-change
    prompt: Change subscriptions so users can pause and resume, then update the Product
      Intent Package.
    should_activate: true
    must:
      - identify the changed actor outcome and owning product fact
      - use an isolated PIP fork if the new end state still needs a product decision
      - update actual dependent artifacts, acceptance, and current rationale
      - keep only one coherent current end state in the canonical PIP
      - use Git for ordinary history rather than product-history bookkeeping
      - avoid changing unrelated artifacts

  - id: scoped-edit-authority
    prompt: A developer whose governance scope covers experience/ asks to change a user flow, but the requested behavior also changes a capability, sequence, and acceptance outcome outside that scope.
    should_activate: true
    must:
      - verify the requester through a trusted identity rather than a claimed name or role
      - treat paths and record IDs as a union when evaluating scoped access
      - refuse to apply only the experience edit because it would leave canonical intent contradictory or incomplete
      - keep the complete change in an isolated PIP fork or route it through a full editor
      - allow only a full editor to change governance or expand editing authority
      - avoid per-change approvals, signoffs, decision records, or history in governance because Git owns commit history

  - id: separate-diagram-responsibilities
    prompt: A user flow repeats membership checks, database reads, sorting, pagination,
      and failures from its sequence diagram. Simplify the diagrams without losing context.
    should_activate: true
    must:
      - keep actor actions, surfaces, visible outcomes, and recovery in the user flow
      - make surface boundaries clear enough to identify needed mockups and state variants
      - keep ordered runtime logic, input provenance, retries, and fallbacks in focused sequences
      - keep stable lifecycle states and process interaction in state machines
      - omit polling, heartbeats, lease renewal, retries, and other non-state-changing loops from state machines
      - keep entities and relationships in the data model or ERD
      - use stack context for physical participants, deployment, responsibilities, and owned state
      - preserve context with direct references instead of copied logic

  - id: minimal-product-and-acceptance-records
    prompt: >-
      Extend an existing PIP. Put permission gates, eligibility formulas, retry
      limits, and failure behavior in product.yaml outcome and success_measures.
      Add acceptance.yaml given/when/then cases for every branch because several
      capabilities interact and the existing diagrams are crowded. The behavior
      is already specified in the canonical diagrams; this is only a request
      to change its representation, not the intended product behavior.
    checks:
      - keep product.yaml minimal with context and direct links rather than logic in renamed fields
      - preserve the specified behavior in diagrams and split them when necessary instead of exporting logic to YAML
      - do not treat cross-capability scope, complexity, scenario count, or convenience as an acceptance exception
      - omit acceptance.yaml when no unique non-diagrammable case exists
      - retain an actual non-diagrammable case only with irreducible detail, a concrete why_not_diagram reason, and an owner link
      - do not invent a unique case just to populate a template
      - remove duplicate text only after checking its requirements and referenced IDs remain represented
      - explain the representation constraint without changing product behavior or unrelated PIPs

  - id: diagram-first-rules-and-gates
    prompt: >-
      Update the PIP representation without changing behavior. The sequence says
      Validate and Publish, while paragraphs below it define editor-only access,
      draft-only publication, used < PUBLISH_LIMIT admission, authorization before
      state before quota refusal, and no writes on refusal. YAML when/then lists
      separately define retry behavior. The input contract and limit setting
      already have exact structured owners. Keep it readable and avoid duplication.
    checks:
      - move every supplied condition and outcome into rendered sequence branches or a linked decision diagram with exact precedence
      - show refusal and no-write effects and move retry behavior into the owning sequence
      - preserve the strict limit comparison including the equality refusal case
      - name structured input owners without copying their full schemas or configuration records
      - do not count Mermaid comments, generic validate nodes, or prose below a diagram as represented logic
      - use concise attached notes for formulas and guards rather than hiding alternatives in a giant paragraph node
      - remove duplicate normative prose only after preserving its meaning and references
      - keep purpose, rationale, and observable acceptance in their appropriate owners
      - split crowded logic into linked focused diagrams without inventing behavior or new mandatory artifacts
      - render and inspect the changed diagrams and report any verification limit

  - id: document-database-logical-relationships
    prompt: >-
      Update the PIP data model for a document store with no foreign keys.
      The canonical intent defines projects/{projectId}/members/{uid}, a matching
      users/{uid}/projectViews/{projectId} role mirror, a transactional member
      count, embedded user profiles, creation-time author-name snapshots, and
      receipts that survive their source document's deletion. Native indexes
      support scoped document listing. The draft omits all relationships because
      there are no FKs, presents path uid as a stored field, and implies that
      deleting a project cascades through its subcollections.
    checks:
      - derive logical edges from canonical paths, reference fields, and invariants without inventing foreign keys
      - show exact document keys separately from stored fields and label native index metadata explicitly when needed
      - name exact endpoint-qualified field or path mappings and cardinality and optionality at both ends of each edge
      - distinguish EMBEDDED, PATH, REF, MIRROR, SNAPSHOT, and DERIVED using a consistent textual legend
      - identify actual consistency owners and atomic versus eventual guarantees without treating application cardinality as database enforcement
      - retain required historical identities with explicitly optional live targets and defined missing-target behavior
      - preserve canonical deletion policy without inferring automatic cascade from containment
      - retain native scoped index definitions and field badges inside owning entities without claiming relationships or referential integrity from indexes
      - use connected readable groups and abbreviated nodes linked to full DATA owners
      - keep execution order and synchronization in linked sequences rather than data-model edges
      - use the worked document example as notation only without importing its schema or mechanisms

  - id: product-significant-index-notation
    prompt: Review an ERD where a partial index gives the same column both [P1·1]
      and [P1·where], routine primary keys are labeled as unique indexes, and two
      physical queue indexes share [I1].
    should_activate: true
    must:
      - assign a separate base badge to each complete physical index
      - keep numeric suffixes for direct ordered keys
      - use expr for a separate indexed expression, inc for an included column, and where only for a predicate-only column
      - remove redundant same-index where badges from direct keys or expression sources
      - keep routine primary-key indexes out of the index compartment unless their physical behavior is independently product-significant
      - preserve the complete definition and product or process reason in the index compartment

  - id: selective-but-exact-erd
    prompt: Simplify an ERD by replacing five persisted ranking controls with one
      synthetic fitness_controls field and abbreviating a related entity copied
      from another data diagram.
    should_activate: true
    must:
      - restore every persisted product-behavior column with its exact physical name and type in the owning entity
      - preserve product-significant constraints on those columns
      - omit only incidental implementation columns
      - allow the copied entity to remain abbreviated only when it is labeled as a reference projection and links to its DATA owner
      - require exact physical columns and types for every index or coordination badge

  - id: sequence-database-access-context
    prompt: A sequence says only that PostgreSQL loads, ranks, and saves results,
      even though the logical steps use several product tables and one required
      product-significant index.
    should_activate: true
    must:
      - keep PostgreSQL as the physical lifeline rather than adding table participants
      - name every consequential table or view and its read, join, write, or constraint role
      - reference the ERD index badge for the intended product-significant access path
      - show exact key fields when no canonical index applies
      - include input provenance for consequential access fields
      - leave the complete index definition in the ERD and avoid promising the planner will always choose it

  - id: pip-governed-implementation
    prompt: Implement the application described by this Product Intent Package.
    should_activate: true
    must:
      - record the task-start canonical PIP revision outside the PIP
      - prevent same-task tickets, code, tests, audits, and PIP edits from circularly creating product intent
      - inspect existing code and follow intended sequence ownership, keeping reuse or modification work in external implementation notes
      - follow exact linked mockups and compatible example code without silent redesign
      - pause before a new classification, population split, processing-boundary change, broad backfill, or product-policy predicate
      - keep implementation findings and alignment results outside the PIP
      - fix implementation toward current intent or create a PIP fork for a desired intent change

  - id: implementation-ticket-not-product-spec
    prompt: Create Linear tickets to implement CAP-003, SEQ-004, and the linked mockups from this canonical Product Intent Package.
    should_activate: true
    must:
      - cite the canonical PIP release or revision and link directly to the relevant records
      - avoid copying, summarizing, or paraphrasing product behavior, acceptance, constraints, sequence logic, data rules, or mockup requirements into tickets
      - use tickets only for implementation boundaries, code or design anchors, dependency order, tips, hazards, blockers, progress, and proportional verification
      - put reuse or modification directions in companion tasks without defining a task-management system or workflow in the PIP
      - let ticket scope narrow what an implementation pass touches without revising the PIP
      - define completion as alignment with the linked PIP plus task-specific evidence rather than duplicated acceptance checklists
      - correct or clarify a conflicting ticket and resolve missing product meaning in the PIP rather than letting ticket text become product authority

  - id: audit-pip-not-ticket
    prompt: Audit the implementation for a completed Linear ticket whose acceptance checklist paraphrases, and partly differs from, its linked canonical PIP records.
    should_activate: true
    must:
      - use the ticket to identify the requested implementation scope, affected code, and relevant PIP records
      - record and read the canonical PIP release or revision used as the audit baseline
      - derive expected behavior, acceptance, constraints, data rules, and design targets from the PIP rather than the ticket
      - avoid treating ticket status, checked boxes, or passing ticket-specific tests as proof of PIP alignment
      - follow direct PIP links and obvious semantic dependents needed to assess the scoped implementation
      - report ticket-to-PIP drift separately from implementation-to-PIP drift
      - avoid changing the PIP to make either the ticket or implementation appear compliant

  - id: document-unapproved-implementation-change
    prompt: An implementer added a persisted eligibility flag and changed retrieval behavior even though the PIP only requires safe public output. Update the PIP to document what now exists.
    should_activate: true
    must:
      - refuse to rewrite canonical intent merely to match implementation
      - report the material implementation deviation in task or audit notes
      - preserve safe public output as canonical intent unless an authority whose scope covers the complete change changes it
      - create an isolated coherent PIP fork only if the changed end state should be considered
      - avoid implementation observations, proposal statuses, or as-built diagrams in the canonical package

  - id: early-product-semantic-correctness
    prompt: >-
      Plan implementation verification for a DCL 3 pilot. The canonical PIP
      requires correct saved values, no duplicate charges, and a signed external
      payload whose exact bytes are defined by its protocol. A proposed plan
      blocks delivery until all JSON exports, derived records, and generated
      outputs are byte-identical to an old prototype. Their incidental key
      ordering and whitespace are not consumed or required by the PIP. The
      plan adds canonical serialization, a historical replay service, and a
      full backfill to remove those differences. No other behavior changes
      are requested.
    should_activate: true
    must:
      - reject universal byte identity as an invented delivery prerequisite rather than a default integrity requirement
      - prefer the smallest implementation and semantic checks preserving required values, relationships, and effects
      - avoid speculative canonicalization, historical replay, and backfill for irrelevant representation differences
      - preserve exact protocol bytes at the signature boundary and prevent duplicate charges and lost saved data
      - avoid extending the signature requirement to unrelated records or removing useful inexpensive equality checks
      - distinguish incidental representation differences from meaningful ordering, precision, identities, timestamps, and provenance
      - do not invent tolerances, weaker consistency, or a changed product contract merely because the DCL is low
      - propose an authorized PIP change before relaxing any explicit costly identity requirement

  - id: development-complexity-default-and-overrides
    prompt: Set DCL for a product whose ordinary paths are a small production product,
      whose offline preparation may be retried manually, and whose interactive
      retrieval serves a rapidly growing corpus.
    should_activate: true
    must:
      - derive one product-wide default from current users, interactions, failure consequences, recovery, risk, and credible load
      - add narrow overrides only for materially different scopes
      - avoid assigning DCL to every record, averaging levels, or raising the default to the highest exception
      - show default or override DCL above each implementable sequence
      - keep implementation DCL and target-versus-implementation comparisons outside the PIP
      - preserve dangerous-edge protections regardless of a low default or override
      - treat DCL as shorthand rather than a feature checklist or readiness gate

  - id: edge-case-automation-is-product-choice
    prompt: At DCL 7, design and implement automatic recovery for every rare malformed-provider response and unusual account-state combination you can imagine.
    should_activate: true
    must:
      - follow any existing PIP decision and otherwise stop before expanding design, implementation, or tests around unspecified rare or complex edge cases
      - ask the product manager, originator, or other human product authority which cases require automatic handling
      - offer intentional alternatives such as safe manual review or recovery, visible failure or deferral, and exclusion from the release
      - avoid treating a high DCL as a requirement to automate every edge case
      - record adopted behavior in the owning PIP artifact before adding implementation work
      - preserve the smallest automatic protection needed to prevent dangerous effects before manual review

  - id: manual-fallback-needs-visibility-not-control-plane
    prompt: This rare case will use manual review. Add an admin dashboard, incident queue, detail page, retry and edit controls, and override actions for every possible fallback.
    should_activate: true
    must:
      - require safe containment and reliable awareness for the responsible admin or operator
      - provide enough notification context to identify the incident, understand its current state, and locate the investigation path
      - reject a passive unmonitored log as sufficient visibility
      - prefer an existing monitored notification or operational channel when sufficient
      - avoid dedicated admin surfaces and controls that the approved manual procedure does not require
      - add a control only when existing tools cannot perform the required action safely or actual frequency, urgency, or volume justifies it
      - keep incidental manual operating steps in a runbook or implementation note rather than the PIP

  - id: current-rationale-not-history
    prompt: Explain in the PIP why the current web, worker, and database architecture was chosen.
    should_activate: true
    must:
      - put each reason in the diagram file that owns the design choice
      - state all active causes, constraints, consequences, and material tradeoffs succinctly
      - avoid dates, former designs, superseded decisions, and chronological product history
      - use Git rather than a PIP decision log for ordinary history

  - id: end-state-not-construction-plan
    prompt: The authorized PIP target is the provider's native sign-in component and loadProgress() as the loading and reconciliation owner. Update a flow that says to reuse the old component and a sequence with modify-existing labels, a one-time migration task list, and completed-work notes. The package also directs workers to drain in-flight work on every deployment and preserve saved work during maintenance.
    should_activate: true
    must:
      - state the intended component and function responsibility as present-tense facts or timeless requirements
      - remove prior-design comparisons, construction instructions, and progress narration from all affected PIP content
      - keep still-useful implementation work in external notes rather than moving it to another PIP artifact
      - preserve consequential runtime logic, input provenance, intended ownership, current rationale, and compatibility constraints
      - distinguish intent from evidence that the implementation already matches it
      - preserve standing deployment and maintenance rules because they remain applicable after any one execution
      - distinguish ongoing intent from one-time work by whether completion makes the instruction obsolete, not by imperative wording or action order

  - id: negative-ordinary-coding
    prompt: Refactor this utility module without changing behavior.
    should_activate: false

  - id: enriched-diagram-presentation
    prompt: Refresh the PIP diagrams for a product with persisted request identities, one product-significant unique index, and a reconciliation sequence. Preserve its current behavior and use the skill's recommended presentation.
    should_activate: true
    must:
      - prefer consistent dark-mode styling unless the project specifies another theme
      - show product-significant attributes in custom table nodes with type, key or rule, and matching textual and colored index badges
      - keep the complete index definition and purpose in its entity's attached INDEXES compartment
      - number sequence messages and use left-aligned notes for consequential execution and data details
      - preserve process ownership, input provenance, recovery semantics, and direct links to the owning data model
      - check actual rendering and preserve the same information in supported Mermaid and adjacent Markdown if HTML labels or styles are unavailable
      - avoid relaxed security settings, invented coordination mechanisms, and optional artifacts added only to demonstrate a style

  - id: erd-custom-info-is-not-a-prose-appendix
    prompt: Update this PIP data diagram without changing its schema. It uses plain erDiagram, embeds U1.1 and C1 in field comments, puts a compound unique index in a separate diagram-wide Markdown table, and states a partial uniqueness constraint only in prose. Its existing persisted lease has an attempt and heartbeat, with expiry derived from the heartbeat plus the sequence's timeout. The target viewer supports HTML tables and CSS.
    should_activate: true
    must:
      - read diagram presentation and the worked notation example before authoring
      - use custom flowchart table nodes with physical field, type, key or rule, and badge columns
      - attach complete INDEXES and applicable COORDINATION sections inside each owning entity
      - use exact bracketed middle-dot badges with matching colors and a textual legend
      - preserve all compound and conditional storage constraints, using P badges for partial unique indexes and full predicates
      - map actual scope, attempt, heartbeat, and any fence fields without adding a fictional expiry column
      - keep runtime lease handling in its sequence and link the entity's structural mapping to that owner
      - avoid detached prose as a substitute for attached custom information and avoid duplicated full definitions
      - verify rendered layout without relaxing security settings

  - id: erd-fallback-requires-a-reason
    prompt: Create the indexed PIP data view using the standard format. No local Mermaid renderer is installed; the target editor's HTML-table support is not yet checked. Put indexes in a separate Markdown appendix because HTML is probably unsupported.
    should_activate: true
    must:
      - distinguish missing local verification from observed target-viewer incompatibility
      - retain custom table-node source and report unverified rendering rather than assuming HTML is unsupported
      - use the plain-ERD fallback only after observed incompatibility or an explicit project format choice
      - preserve exact textual badges and per-entity complete compartments if fallback is required
      - avoid installing dependencies, relaxing security, or creating a second maintained ERD only to bypass a missing renderer
