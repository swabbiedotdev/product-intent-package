# This product uses a separate acceptance file because its failure, recovery,
# and quality scenarios are clearer as detailed given/when/then cases than as a
# short capability list.
scenarios:
  - id: ACC-001
    name: Apply an accepted increment exactly once
    verifies:
      - CAP-001
      - RULE-001
      - SEQ-001
    given:
      - the persisted counter value is 4
    when:
      - one increment is accepted
    then:
      - the persisted counter value is 5
      - the screen displays 5
      - exactly one mutation occurs
      - one durable receipt records the request and resulting value

  - id: ACC-002
    name: Recover from a confirmed precommit failure
    verifies:
      - CAP-001
      - RULE-001
      - SEQ-001
    given:
      - the persisted counter value is 4
      - an increment fails before commit
    when:
      - the failure is confirmed
    then:
      - the persisted counter value remains 4
      - the screen displays the unchanged value and offers Retry
      - the user may attempt another increment
      - no increment receipt is created

  - id: ACC-003
    name: Meet the increment latency and reliability target
    verifies:
      - CAP-001
      - QC-001
    given:
      - increment traffic is sustained at 10 requests per second
    when:
      - accepted increments are measured under concurrent load
    then:
      - accepted-increment latency meets QC-001
      - the final persisted value accounts for every accepted increment
      - every accepted request has exactly one durable receipt

  - id: ACC-004
    name: Recover from an initial read failure
    verifies:
      - CAP-001
      - SEQ-002
    given:
      - the persisted counter value is 4
      - the initial read fails
    when:
      - the user chooses Retry and the next read succeeds
    then:
      - the screen displays 4
      - no mutation occurs

  - id: ACC-005
    name: Reconcile an increment whose response is lost after commit
    verifies:
      - CAP-001
      - RULE-001
      - SEQ-001
      - SEQ-002
    given:
      - the persisted counter value is 4
      - one increment commits but its response is lost
    when:
      - the client detects an unknown outcome and reconciles the original request
    then:
      - the API returns the original request's durable receipt
      - the client does not create a second increment request
      - the screen displays the original request's recorded resulting value of 5
      - exactly one mutation has occurred

  - id: ACC-006
    name: Complete the counter at its target
    verifies:
      - CAP-001
      - RULE-001
      - SM-001
      - SEQ-001
    given:
      - the persisted counter value is 9
      - the fixed target is 10
      - the counter state is open
    when:
      - one increment is accepted
    then:
      - the persisted counter value is 10
      - the counter state is complete
      - the screen shows Target reached without an Increment action
      - another increment cannot advance the value

  - id: ACC-007
    name: Recover when reconciliation cannot yet resolve an increment
    verifies:
      - CAP-001
      - RULE-001
      - SEQ-002
    given:
      - an increment has an unknown outcome and its request key is retained
    when:
      - a reconciliation read fails
    then:
      - Retry repeats reconciliation for that same request key
      - Increment and Dismiss remain unavailable
      - the screen does not claim the increment failed or left progress unchanged

  - id: ACC-008
    name: Retry while the original transaction may still be running
    verifies:
      - CAP-001
      - RULE-001
      - SEQ-001
      - SEQ-002
    given:
      - an increment has an unknown outcome
      - a successful reconciliation read finds no receipt
    when:
      - the user chooses Retry
    then:
      - the screen describes the outcome as unconfirmed until resolved
      - the retry uses the original request key
      - concurrent original and retry attempts cannot create more than one increment or receipt
