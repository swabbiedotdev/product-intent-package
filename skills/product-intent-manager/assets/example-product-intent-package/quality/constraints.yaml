constraints:
  - id: QC-001
    name: Accepted increment latency and reliability
    applies_to:
      - CAP-001
      - SEQ-001
    measure: Accepted increment latency, receipt uniqueness, and persistence consistency under concurrent load.
    target: p95 latency is no more than 500 milliseconds at 10 requests per second, with no lost or duplicate accepted increments.
