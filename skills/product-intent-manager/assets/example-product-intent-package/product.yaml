schema_version: 7.0.0
name: Counter
release: 1.0.0
outcome: A user can see and advance shared progress toward a fixed target without creating a duplicate increment after an uncertain response.
boundary: One shared counter, one fixed target, and the user-visible loading, increment, completion, failure, and reconciliation paths.
dcl:
  level: 4
  basis: >-
    Users rely on the counter in production, common read and write failures need
    clear recovery, and modest load does not justify generalized scale machinery.
actors:
  - id: ACTOR-001
    name: User
    goal: See progress toward the target and advance it by one.
capabilities:
  - id: CAP-001
    name: Read and advance shared progress
    actor_ids:
      - ACTOR-001
    outcome: The user can view and advance shared progress toward completion.
    behavior_refs:
      - modules/counter/experience/user-flows.md#flow-001-read-and-increment-the-counter
      - modules/counter/sequences/sequences.md#seq-001-increment-once
      - modules/counter/sequences/sequences.md#seq-002-load-or-reconcile-progress
    quality_ref: modules/counter/quality/constraints.yaml
exclusions:
  - Authentication, accounts, and multi-tenancy
  - Changing or resetting the target
